<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#08132e" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="description" content="삼성 드림클래스의 여러 장면을 통해 나의 멘토링 방식을 알아보는 CSR Fair 체험 콘텐츠" />
  <title>나의 드림 멘토 유형</title>
  <link rel="canonical" href="https://psiudo.github.io/dreamclass-mentor-mode/" />
  <script>if(location.search){history.replaceState(null,"",location.pathname+location.hash);}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://raw.githubusercontent.com">
  <link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@600;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --night:#08132e;
      --deep:#0e2358;
      --samsung:#1428a0;
      --indigo:#5366e6;
      --dawn:#ff9e6d;
      --gold:#ffd166;
      --cream:#f4f7ff;
      --muted:#a7b5d8;
      --line:rgba(185,199,235,.22);
      --card:rgba(255,255,255,.065);
      --card-strong:rgba(255,255,255,.10);
      --shadow:0 22px 70px rgba(0,0,0,.24);
      --r:16px;
      --glow:0;
    }
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    body{
      color:var(--cream);
      background:var(--night);
      font-family:"IBM Plex Sans KR",-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif;
      -webkit-font-smoothing:antialiased;
      overflow-x:hidden;
    }
    button{font:inherit}
    button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
    #sky{
      position:fixed;inset:0;z-index:-3;
      background:
        radial-gradient(120% 80% at 50% 108%,
          rgba(255,209,102,calc(var(--glow)*.52)) 0%,
          rgba(255,158,109,calc(var(--glow)*.42)) 24%,
          rgba(83,102,230,calc(.18 + var(--glow)*.27)) 51%,
          transparent 73%),
        linear-gradient(180deg,#050b1f 0%,var(--night) 42%,var(--deep) 100%);
      transition:background .9s ease;
    }
    #stars{position:fixed;inset:0;z-index:-2;opacity:calc(1 - var(--glow)*.72);transition:opacity .9s ease;pointer-events:none}
    .star{position:absolute;border-radius:50%;background:#fff;animation:tw 4s ease-in-out infinite}
    @keyframes tw{0%,100%{opacity:.13;transform:scale(.86)}50%{opacity:.82;transform:scale(1.15)}}
    .horizon{
      position:fixed;left:-10%;right:-10%;bottom:-16vh;height:38vh;z-index:-1;
      background:radial-gradient(ellipse at 50% 0%,rgba(255,217,126,calc(var(--glow)*.24)),transparent 64%);
      filter:blur(24px);pointer-events:none
    }
    .shell{width:min(100%,700px);min-height:100vh;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 20px max(54px,env(safe-area-inset-bottom));display:flex;flex-direction:column}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:44px}
    .brand{display:flex;align-items:center;gap:9px;min-width:0}
    .brandWord{display:flex;flex-direction:column;gap:2px;background:rgba(255,255,255,.96);color:#1428a0;padding:7px 10px;border-radius:9px;box-shadow:0 7px 20px rgba(0,0,0,.18);line-height:1}.brandWord b{font-size:10px;letter-spacing:.1em}.brandWord span{font-size:6.5px;letter-spacing:.08em;color:#7781a5}
        .stepnum{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.11em;color:var(--muted);white-space:nowrap}
    .progress{height:2px;background:var(--line);border-radius:99px;overflow:hidden;margin:12px 0 30px}
    .progress i{display:block;width:0;height:100%;background:linear-gradient(90deg,var(--indigo),var(--dawn),var(--gold));transition:width .42s cubic-bezier(.4,0,.2,1)}
    #app{flex:1;display:flex;flex-direction:column}
    .screen{flex:1;display:flex;flex-direction:column;animation:enter .38s ease both}
    @keyframes enter{from{opacity:0;transform:translateY(13px)}to{opacity:1;transform:none}}
    .intro{justify-content:center;padding:6vh 0 5vh}
    .eyebrow{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.18em;color:var(--dawn);margin-bottom:20px}
    h1,h2,h3,p{margin-top:0}
    h1{font-family:"Hahmlet",serif;font-size:clamp(35px,9vw,54px);line-height:1.18;letter-spacing:-.045em;margin-bottom:19px}
    h1 em{font-style:normal;color:var(--gold)}
    .introSub{max-width:580px;color:#c4cee9;font-size:15px;line-height:1.78;margin-bottom:26px}
    .meta{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:15px 0;margin:0 0 29px}
    .meta div{padding:0 12px;border-right:1px solid var(--line)}
    .meta div:first-child{padding-left:0}.meta div:last-child{border-right:0;padding-right:0}
    .meta span{display:block;font-family:"IBM Plex Mono",monospace;font-size:9.5px;color:var(--muted);letter-spacing:.12em;margin-bottom:5px}
    .meta strong{font-size:13px;font-weight:600;color:#eef2ff}
    .primary{align-self:flex-start;border:0;border-radius:999px;padding:15px 31px;background:var(--gold);color:#0b1430;font-weight:700;font-size:15.5px;cursor:pointer;box-shadow:0 10px 32px rgba(255,209,102,.22);transition:.18s}
    .primary:hover{transform:translateY(-2px);box-shadow:0 14px 38px rgba(255,209,102,.28)}
