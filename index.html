<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071a33">
  <title>DREAMCLASS MENTOR MODE</title>
  <style>
    html,body{margin:0;min-height:100%;background:#f4f1e9;color:#071a33;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
    main{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
    .mark{width:48px;height:48px;margin:0 auto 22px;display:grid;place-items:center;border-radius:50%;background:#071a33;color:white;font-weight:900}
    h1{font-size:clamp(28px,8vw,54px);margin:0 0 14px;letter-spacing:-.05em}p{color:#65707d;line-height:1.7}.bar{width:min(280px,75vw);height:4px;background:#d6d4cd;border-radius:99px;overflow:hidden;margin:26px auto}.bar:after{content:"";display:block;width:45%;height:100%;background:#155bd7;animation:load 1.1s ease-in-out infinite alternate}@keyframes load{to{transform:translateX(125%)}}
  </style>
</head>
<body>
<main><div><div class="mark">DC</div><h1>DREAMCLASS<br>MENTOR MODE</h1><p>멘토링 경험을 불러오고 있습니다.</p><div class="bar"></div><p id="error" aria-live="polite"></p></div></main>
<script>
(async()=>{
  try{
    const names=Array.from({length:12},(_,i)=>`assets/p${String(i+1).padStart(2,'0')}.txt`);
    const parts=await Promise.all(names.map(async n=>{const r=await fetch(n,{cache:'no-store'});if(!r.ok)throw new Error(n);return r.text()}));
    const binary=atob(parts.join(''));
    const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));
    const html=new TextDecoder('utf-8').decode(bytes);
    document.open();document.write(html);document.close();
  }catch(e){document.getElementById('error').textContent='페이지를 불러오지 못했습니다. 잠시 후 새로고침해주세요.';console.error(e)}
})();
</script>
</body>
</html>
