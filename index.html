<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070d22">
  <title>DREAMCLASS MENTOR MODE</title>
  <style>
    html,body{margin:0;min-height:100%;background:#070d22;color:#f4f6ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
    main{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
    .mark{width:48px;height:48px;margin:0 auto 22px;display:grid;place-items:center;border:1px solid rgba(255,209,102,.45);border-radius:50%;color:#ffd166;font-weight:800}
    h1{font-size:clamp(28px,8vw,54px);margin:0 0 14px;letter-spacing:-.05em}p{color:#aab7da;line-height:1.7}.bar{width:min(280px,75vw);height:2px;background:rgba(184,198,235,.2);overflow:hidden;margin:26px auto}.bar:after{content:"";display:block;width:45%;height:100%;background:linear-gradient(90deg,#445bd8,#ff9f76,#ffd166);animation:load 1.1s ease-in-out infinite alternate}@keyframes load{to{transform:translateX(125%)}}
  </style>
</head>
<body>
<main><div><div class="mark">DC</div><h1>DREAMCLASS<br>MENTOR MODE</h1><p>멘토링 경험을 불러오고 있습니다.</p><div class="bar"></div><p id="error" aria-live="polite"></p></div></main>
<script>
(async()=>{
  try{
    const names=Array.from({length:7},(_,i)=>`assets/v2p${String(i+1).padStart(2,'0')}.txt`);
    const parts=await Promise.all(names.map(async n=>{const r=await fetch(n,{cache:'no-store'});if(!r.ok)throw new Error(n);return r.text()}));
    const binary=atob(parts.join(''));
    const compressed=Uint8Array.from(binary,c=>c.charCodeAt(0));
    const stream=new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    document.open();document.write(html);document.close();
  }catch(e){document.getElementById('error').textContent='페이지를 불러오지 못했습니다. 잠시 후 새로고침해주세요.';console.error(e)}
})();
</script>
</body>
</html>
