<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08132e">
  <title>나의 드림 멘토 유형</title>
  <style>
    html,body{margin:0;min-height:100%;background:#08132e;color:#f4f7ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
    main{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
    .mark{width:46px;height:36px;margin:0 auto 20px;position:relative}.mark i{position:absolute;width:22px;height:12px;border-radius:8px;transform:rotate(-10deg)}.mark i:nth-child(1){left:0;top:0;background:#5366e6}.mark i:nth-child(2){left:20px;top:10px;background:#ffd166}.mark i:nth-child(3){left:5px;top:22px;background:#ff9e6d}
    h1{font-size:clamp(27px,8vw,48px);margin:0 0 13px;letter-spacing:-.05em}p{color:#a7b5d8;line-height:1.7}.bar{width:min(270px,72vw);height:3px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden;margin:25px auto}.bar:after{content:"";display:block;width:40%;height:100%;background:linear-gradient(90deg,#5366e6,#ff9e6d,#ffd166);animation:load 1s ease-in-out infinite alternate}@keyframes load{to{transform:translateX(150%)}}
  </style>
</head>
<body>
<main><div><div class="mark"><i></i><i></i><i></i></div><h1>나의 드림 멘토 유형</h1><p>체험을 불러오고 있습니다.</p><div class="bar"></div><p id="error" aria-live="polite"></p></div></main>
<script>
(async()=>{
  try{
    const names=[
      'assets/v4c01.txt','assets/v4c02.txt','assets/v4c03.txt',
      'assets/v4c04a.txt','assets/v4c04b1.txt','assets/v4c04b2.txt',
      'assets/v4c05.txt','assets/v4c06.txt'
    ];
    const parts=await Promise.all(names.map(async n=>{const r=await fetch(n,{cache:'no-store'});if(!r.ok)throw new Error(n);return r.text()}));
    const binary=atob(parts.join(''));
    const compressed=Uint8Array.from(binary,c=>c.charCodeAt(0));
    const stream=new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    document.open();document.write(html);document.close();
  }catch(e){document.getElementById('error').textContent='페이지를 불러오지 못했습니다. 새로고침해주세요.';console.error(e)}
})();
</script>
</body>
</html>
